# Local stack: docker compose up --build, then open http://localhost:8081
# The passwords below are development defaults only.
name: onboarding-portal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onboarding-dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # tokens always carry the public issuer, even when the backend fetches keys internally
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/onboarding-realm.json:/opt/keycloak/data/import/onboarding-realm.json:ro

  sanctions-mock:
    build: ./mock-check
    ports:
      - "8090:8090"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/onboarding
      DB_USER: onboarding
      DB_PASSWORD: ${POSTGRES_PASSWORD:-onboarding-dev}
      OIDC_ISSUER_URI: http://localhost:8180/realms/onboarding
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/onboarding/protocol/openid-connect/certs
      SANCTIONS_BASE_URL: http://sanctions-mock:8090
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      sanctions-mock:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/onboarding
      KEYCLOAK_CLIENT_ID: onboarding-portal
      REQUIRE_HTTPS: "false"
    ports:
      - "8081:8080"
    depends_on:
      - backend

volumes:
  pgdata:
