# Internal only: the frontend's nginx proxies /api to this service, so the API has no Route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/bttcode/onboarding-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: onboarding-config
                  key: KEYCLOAK_PUBLIC_URL
            - name: FRONTEND_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: onboarding-config
                  key: FRONTEND_PUBLIC_URL
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/onboarding
            - name: DB_USER
              value: onboarding
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onboarding-secrets
                  key: POSTGRES_PASSWORD
            - name: OIDC_ISSUER_URI
              value: $(KEYCLOAK_PUBLIC_URL)/realms/onboarding
            - name: OIDC_JWK_SET_URI
              value: http://keycloak:8080/realms/onboarding/protocol/openid-connect/certs
            - name: SANCTIONS_BASE_URL
              value: http://sanctions-mock:8090
            - name: CORS_ALLOWED_ORIGINS
              value: $(FRONTEND_PUBLIC_URL)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
