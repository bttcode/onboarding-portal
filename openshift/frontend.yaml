apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/bttcode/onboarding-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: onboarding-config
                  key: KEYCLOAK_PUBLIC_URL
            - name: BACKEND_URL
              value: http://backend:8080
            - name: KEYCLOAK_ISSUER
              value: $(KEYCLOAK_PUBLIC_URL)/realms/onboarding
            - name: KEYCLOAK_CLIENT_ID
              value: onboarding-portal
            - name: REQUIRE_HTTPS
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: portal
spec:
  to:
    kind: Service
    name: frontend
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
